name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_management

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d task_management"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          echo "PORT=5000" >> .env.test
          echo "DBUSER=postgres" >> .env.test
          echo "DBPASSWORD=postgres" >> .env.test
          echo "DBHOST=localhost" >> .env.test
          echo "DBPORT=5432" >> .env.test
          echo "DBNAME=task_management" >> .env.test
          echo "JWT_SECRET=test-secret" >> .env.test
          echo "JWT_TIMEOUT=1h" >> .env.test

      - name: Create database tables
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d task_management \
            -f database/init.sql

      - name: Run tests
        run: npm test -- --runInBand

      - name: Generate coverage
        run: npm test -- --coverage --runInBand